<body class="bg-[#0b0c10] text-gray-100 min-h-screen flex flex-col items-center p-8 overflow-x-hidden">
    <div id="root" class="w-full max-w-4xl flex flex-col items-center animate-fade-in"></div>

    <!-- React, Babel, etc. scripts remain unchanged -->

    <script type="text/babel">
        const { useState } = React;
        const root = ReactDOM.createRoot(document.getElementById('root'));

        const API_KEY = ""; // Gemini API Key
        const TEXT_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${API_KEY}`;
        const IMAGE_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${API_KEY}`;

        function App() {
            const [startupIdea, setStartupIdea] = useState('');
            const [roadmap, setRoadmap] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [isImageLoading, setIsImageLoading] = useState(false);
            const [roadmapImage, setRoadmapImage] = useState(null);
            
            const parseMarkdown = (text) => ({ __html: marked.parse(text) });

            const handleGenerateRoadmap = async () => {
                if (!startupIdea.trim()) { alert('Please enter your startup idea.'); return; }
                setIsLoading(true); setRoadmap(''); setRoadmapImage(null);
                
                const systemPrompt = `You are an expert AI business consultant...`; // unchanged
                const userQuery = `My startup idea is: "${startupIdea}". ...`; // unchanged
                
                try {
                    const response = await fetch(TEXT_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                        }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || `API call failed with status: ${response.status}`);
                    }

                    const result = await response.json();
                    const generatedText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (generatedText) setRoadmap(generatedText);
                    else throw new Error('No content was generated by the model.');
                } catch (error) {
                    console.error('Error:', error);
                    setRoadmap(`An error occurred: ${error.message}`);
                } finally { setIsLoading(false); }
            };
            
            const handleExportPDF = () => {
                const roadmapElement = document.getElementById('roadmap-output');
                html2pdf().set({
                    margin: 1,
                    filename: 'startup_roadmap.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                }).from(roadmapElement).save();
            };

            const handleGenerateVisual = async () => {
                setIsImageLoading(true); setRoadmapImage(null);
                const imagePrompt = `Create a visually appealing infographic for: ${roadmap}`;
                const payload = { contents: [{ parts: [{ text: imagePrompt }] }], generationConfig: { responseModalities: ['TEXT','IMAGE'] }};

                try {
                    const response = await fetch(IMAGE_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });

                    const result = await response.json();
                    const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    if (base64Data) setRoadmapImage(`data:image/png;base64,${base64Data}`);
                    else throw new Error('Image generation failed. No image data received.');
                } catch (error) {
                    console.error('Error generating image:', error);
                    alert('Failed to generate image. Please try again.');
                } finally { setIsImageLoading(false); }
            };

            return (
                <>
                    <section className="text-center py-20 px-4 max-w-4xl w-full animate-fade-in-up">
                        <h1 className="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 mb-4 animate-fade-in-up">
                            Turn Your Idea Into a Strategic Roadmap
                        </h1>
                        <p className="text-gray-300 text-lg sm:text-xl max-w-2xl mx-auto mb-8 animate-fade-in-up delay-200">
                            Describe your startup idea and get an AI-generated roadmap with market analysis, competitive insights, and step-by-step execution plan.
                        </p>
                    </section>

                    <section className="w-full max-w-3xl mb-12 animate-fade-in-up delay-300">
                        <div className="card-gradient p-6 sm:p-8 rounded-3xl shadow-lg border border-gray-700 transition-transform hover:scale-[1.02]">
                            <label htmlFor="startup-idea" className="flex items-center text-sm font-medium text-gray-400 mb-4">
                                <span className="bg-gray-800 text-purple-400 rounded-full w-6 h-6 flex items-center justify-center mr-2">💡</span>
                                Describe Your Startup Idea
                            </label>
                            <textarea
                                id="startup-idea"
                                rows="6"
                                className="w-full p-4 text-sm bg-gray-900 text-white rounded-xl resize-none outline-none focus:ring-2 focus:ring-purple-500 transition-all duration-300 placeholder-gray-500"
                                placeholder="e.g., A mobile app that uses AI..."
                                value={startupIdea}
                                onChange={(e) => setStartupIdea(e.target.value)}
                                disabled={isLoading}
                            />
                            <div className="flex justify-between items-center mt-2 text-xs text-gray-500">
                                <span>{startupIdea.length}/2000 characters</span>
                                <span>Be detailed for better insights</span>
                            </div>
                            <div className="mt-6 flex justify-center">
                                <button
                                    onClick={handleGenerateRoadmap}
                                    disabled={isLoading}
                                    className="btn-hero px-12 py-4 rounded-xl text-lg font-semibold flex items-center justify-center transition-all duration-300 transform hover:scale-105"
                                >
                                    {isLoading ? (
                                        <div className="flex items-center animate-fade-in">
                                            <svg className="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                            </svg>
                                            Generating...
                                        </div>
                                    ) : (
                                        <>Generate AI Roadmap <span className="ml-2">✨</span></>
                                    )}
                                </button>
                            </div>
                        </div>
                    </section>

                    {roadmap && (
                        <section className="w-full max-w-3xl mb-12 animate-fade-in-up delay-400">
                            <div id="roadmap-output" className="bg-gray-800 p-6 sm:p-8 rounded-3xl shadow-xl border border-gray-700 transition-transform hover:scale-[1.01]">
                                <h2 className="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 mb-4 animate-fade-in-up">
                                    Your Strategic Roadmap
                                </h2>
                                <div className="prose prose-invert max-w-none text-gray-300 leading-relaxed animate-fade-in" dangerouslySetInnerHTML={parseMarkdown(roadmap)}></div>
                                <div className="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
                                    <button onClick={handleExportPDF} className="btn-hero px-8 py-3 rounded-xl text-lg font-semibold flex items-center justify-center transition-all duration-300 transform hover:scale-105 bg-gradient-to-r from-blue-500 to-purple-500 hover:from-blue-600 hover:to-purple-600 text-white">
                                        Export as PDF
                                    </button>
                                    <button onClick={handleGenerateVisual} disabled={isImageLoading} className="btn-hero px-8 py-3 rounded-xl text-lg font-semibold flex items-center justify-center transition-all duration-300 transform hover:scale-105 bg-gradient-to-r from-pink-500 to-orange-500 hover:from-pink-600 hover:to-orange-600 text-white">
                                        {isImageLoading ? (
                                            <div className="flex items-center animate-fade-in">
                                                <svg className="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Generating Visual...
                                            </div>
                                        ) : "Generate Visual"}
                                    </button>
                                </div>
                            </div>
                        </section>
                    )}

                    {roadmapImage && (
                        <section className="w-full max-w-3xl my-12 animate-fade-in-up delay-500">
                            <div className="bg-gray-800 p-6 sm:p-8 rounded-3xl shadow-xl border border-gray-700 transition-transform hover:scale-[1.01]">
                                <h2 className="text-xl sm:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-orange-400 mb-4 animate-fade-in-up">
                                    Pictorial Representation
                                </h2>
                                <img src={roadmapImage} alt="Visual representation of the startup roadmap" className="w-full rounded-xl shadow-lg border border-gray-700 animate-fade-in" />
                                <a href={roadmapImage} download="roadmap_visual.png" className="block mt-4 text-center text-blue-400 hover:underline animate-fade-in">
                                    Download Image
                                </a>
                            </div>
                        </section>
                    )}
                </>
            );
        }

        root.render(<App />);
    </script>
</body>
